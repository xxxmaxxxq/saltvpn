[project]
name = "vpn-service-api"
version = "1.0.0"
description = "Telegram VPN service: bot, billing, Marzban integration, auto-healing"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]           # Depends() в дефолтах FastAPI — это нормально

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
