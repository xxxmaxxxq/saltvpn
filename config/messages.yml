# ═══════════════════════════════════════════════════════════════════════════
#  ТЕКСТЫ БОТА
#  Меняйте свободно — код не сломается. Поддерживается HTML-разметка Telegram:
#  <b>жирный</b>, <i>курсив</i>, <code>моноширинный</code>, <a href="">ссылка</a>
#  Подстановки в фигурных скобках {вот_такие} заполняет код — их не удаляйте.
#  После изменения:  make restart
# ═══════════════════════════════════════════════════════════════════════════

# ── Онбординг ──────────────────────────────────────────────────────────────
start_new: |
  👋 <b>{name}, привет! Это SaltVPN.</b>

  Интернет без границ и без лишних вопросов:

  🌍 Нидерланды и Россия — переключение одним касанием
  ⚡ Скорость не режем, трафик не считаем
  🔒 Историю посещений не храним — её просто нет

  🎁 <b>Первые 3 дня — бесплатно.</b>
  Без карты, без регистрации, без «пробного периода, который спишет деньги».

  Нажмите кнопку ниже: ключ будет готов через 10 секунд.

start_returning: |
  👋 <b>С возвращением, {name}!</b>

  {status_line}

  Всё на месте: ключ прежний, серверы работают.

# Подписка на паузе: человек сам её заморозил и вернулся
start_paused: |
  👋 <b>С возвращением, {name}!</b>

  ⏸ Подписка заморожена до <b>{until_date}</b> — дни не сгорают.
  Разморозить можно одним касанием, доступ вернётся сразу.

# Подписка закончилась. Главное здесь — снять страх «всё придётся настраивать
# заново»: ключ и настройки сохраняются, поэтому возврат стоит одного касания
start_expired: |
  👋 <b>{name}, с возвращением!</b>

  Подписка закончилась {expires_date}, но всё на месте:
  ключ прежний, настройки сохранены — переустанавливать ничего не нужно.

  ⚡ Полная скорость
  🌍 Европа и Россия в одном ключе
  🔒 Ноль логов

  Продлите — и VPN заработает сразу после оплаты.

trial_activated: |
  ✅ <b>Готово! VPN активен на {days} дня.</b>

  Осталось подключить его к устройству — это один клик:

  1️⃣ Нажмите «⚡ Подключить в 1 клик»
  2️⃣ Разрешите открыть приложение
  3️⃣ Нажмите «Подключиться» в приложении

  Если приложения ещё нет — кнопка сама предложит его установить.

trial_already_used: |
  🙂 Бесплатный период вы уже использовали.

  Но у нас есть кое-что получше — подписка от <b>{min_price} ₽</b> в месяц
  с безлимитной скоростью и поддержкой.

# ── Главное меню ───────────────────────────────────────────────────────────
main_menu: |
  🏠 <b>Главное меню</b>

  Выберите раздел. Те же разделы доступны в кнопке «Меню»
  рядом с полем ввода.

help: |
  📖 <b>Помощь и инструкции</b>

  <b>Как подключиться</b>

  📱 <b>iPhone / iPad</b>
  1️⃣ Установите приложение Happ по кнопке ниже
  2️⃣ Вернитесь в бота → «⚡ Подключить в 1 клик»
  3️⃣ Разрешите импорт и нажмите «Подключиться»

  🤖 <b>Android</b>
  Тот же порядок: Happ → «⚡ Подключить в 1 клик».

  💻 <b>Windows / macOS</b>
  Установите Hiddify → скопируйте ссылку-подписку в боте
  → в приложении «Добавить из буфера обмена».

  <b>Частые вопросы</b>

  <b>Сколько устройств можно подключить?</b>
  Одновременно — {device_limit}. Больше слотов даёт реферальная программа:
  два оплативших друга = +1 устройство навсегда.

  <b>Перестало работать</b>
  Нажмите «🆘 Не работает» — бот сам переключит вас на резервный канал
  за 30 секунд. Ключ менять не нужно.

  <b>Не успеваю пользоваться, деньги сгорают?</b>
  Нет. Подписку можно заморозить до 30 дней в год — дни не сгорают,
  а переносятся.

  <b>Скорость и лимиты</b>
  Скорость не режем, трафик не считаем, историю посещений не храним.

# ── Подключение ────────────────────────────────────────────────────────────
connect_instructions: |
  📱 <b>Как подключиться</b>

  <b>iPhone / iPad:</b> установите <a href="{happ_ios}">Happ</a> → вернитесь сюда
  → «⚡ Подключить в 1 клик».

  <b>Android:</b> установите <a href="{happ_android}">Happ</a> → вернитесь сюда
  → «⚡ Подключить в 1 клик».

  <b>Windows / macOS:</b> установите <a href="{hiddify_desktop}">Hiddify</a>
  → скопируйте ссылку-подписку кнопкой ниже → в приложении «Добавить из буфера».

  Ваша ссылка-подписка (работает во всех приложениях):
  <code>{subscription_url}</code>

subscription_link: |
  🔗 <b>Ваша ссылка-подписка</b>

  <code>{subscription_url}</code>

  Она не меняется никогда: даже если мы поменяем серверы,
  конфиги обновятся автоматически.

# ── Личный кабинет ─────────────────────────────────────────────────────────
account_active: |
  👤 <b>Личный кабинет</b>

  Тариф: <b>{tariff_title}</b>
  Статус: <b>{status_text}</b>
  Осталось: <b>{days_left} дн.</b> (до {expires_date})
  Устройства: <b>{devices_used} из {device_limit}</b>
  Трафик за период: <b>{traffic_gb} ГБ</b>
  {streak_line}{pause_line}

account_expired: |
  👤 <b>Личный кабинет</b>

  ❌ Подписка истекла {expires_date}.
  Ваши настройки сохранены — после оплаты VPN заработает сразу,
  переустанавливать ничего не нужно.

streak_line: "🔥 Серия продлений: <b>{streak}</b> → следующее даст <b>+{bonus} дн.</b>\n"
pause_line: "⏸ Заморозка: доступно <b>{pause_left} дн.</b> в этом году\n"

# ── Покупка ────────────────────────────────────────────────────────────────
choose_tariff: |
  💳 <b>Выберите тариф</b>

  Все тарифы: безлимитный трафик, без ограничения скорости,
  до {device_limit} устройств одновременно.

choose_period: |
  📅 <b>{tariff_title}</b>

  Выберите период — чем дольше, тем выгоднее:

choose_provider: |
  💰 <b>К оплате: {amount} ₽</b>
  {promo_line}
  Выберите способ оплаты:

invoice_created: |
  🧾 Счёт создан на <b>{amount} ₽</b>.

  Нажмите кнопку ниже, чтобы оплатить. После оплаты подписка
  продлится автоматически в течение минуты.

payment_success: |
  ✅ <b>Оплата прошла успешно!</b>

  Тариф: <b>{tariff_title}</b>
  Начислено: <b>{days} дн.</b>{bonus_text}
  Действует до: <b>{expires_date}</b>

  Спасибо, что вы с нами 🙏

payment_failed: |
  ❌ Оплата не прошла.

  Деньги не списаны. Попробуйте другой способ оплаты
  или напишите в поддержку — разберёмся.

# ── Уведомления о продлении ────────────────────────────────────────────────
notify_trial_offer: |
  ⏳ <b>Бесплатный период заканчивается через 2 часа.</b>

  Понравилось? Держите персональную скидку <b>−{discount}%</b> на первый месяц:
  <b>{price_old} ₽</b> → <b>{price_new} ₽</b>

  🔥 Предложение действует {valid_hours} часов и больше не повторится.

notify_expire_3d: |
  ⏳ Подписка заканчивается <b>через 3 дня</b> ({expires_date}).

  Продлите заранее — сохраните серию продлений
  и получите <b>+{bonus} бонусных дней</b>.

notify_expire_1d: |
  ⏳ Подписка заканчивается <b>завтра</b>.

  Продлите сейчас, чтобы VPN не отключился в самый неподходящий момент.

notify_expire_2h: |
  ⚠️ <b>Осталось 2 часа.</b>

  Успейте продлить со скидкой <b>−{discount}%</b> — предложение сгорит
  вместе с подпиской.

notify_expired: |
  ❌ <b>Подписка закончилась.</b>

  Доступ отключён, но все настройки сохранены — после оплаты
  VPN заработает мгновенно, без переустановки.

notify_winback: |
  👋 Давно не виделись!

  Возвращайтесь со скидкой <b>−{discount}%</b> на любой тариф.
  Мы за это время добавили новые серверы и стали быстрее.

# ── Auto-Healing ───────────────────────────────────────────────────────────
notify_healed: |
  ⚡ <b>Мы всё починили.</b>

  Один из серверов начал блокироваться, и мы автоматически
  перевели вас на резервный канал. Ключ менять не нужно.

  Если приложение ещё не подхватило изменения — нажмите
  «Обновить подписку» в приложении или кнопку ниже.

healing_started: |
  🔧 Проверяю ваше подключение и переключаю на резервный канал…
  Это займёт до 30 секунд.

healing_done: |
  ✅ <b>Готово. Переключил вас на резервный канал.</b>

  Что сделать сейчас:
  1️⃣ Нажмите «⚡ Обновить подписку» ниже
  2️⃣ В приложении переподключитесь

  Если не помогло — нажмите «Написать в поддержку», ответим быстро.

healing_failed: |
  😔 Автоматически решить не получилось — передаю ваш случай поддержке.

  Опишите, пожалуйста, что именно не работает: не подключается вообще,
  или подключается, но сайты не грузятся?

# ── Пауза ──────────────────────────────────────────────────────────────────
pause_choose: |
  ⏸ <b>Заморозка подписки</b>

  Дни не сгорают: на сколько заморозите — на столько сдвинется окончание.
  Доступно в этом году: <b>{pause_left} дн.</b>

  На сколько дней заморозить?

pause_done: |
  ⏸ <b>Подписка заморожена до {until_date}.</b>

  VPN временно отключён, дни не списываются.
  Разморозить досрочно можно в любой момент кнопкой в кабинете.

pause_resumed: |
  ▶️ <b>Подписка снова активна.</b>

  Действует до <b>{expires_date}</b>. Хорошего интернета!

pause_unavailable: |
  Заморозка недоступна: {reason}

# ── Рефералы ───────────────────────────────────────────────────────────────
referral_info: |
  👥 <b>Приглашайте друзей — получайте устройства</b>

  За каждых <b>{per_slot} друзей</b>, оформивших подписку, вы получаете
  <b>+1 постоянный слот устройства</b> (навсегда, а не на месяц).

  Ваша ссылка:
  {ref_link}

  Приглашено: <b>{total}</b> · оплатили: <b>{qualified}</b>
  Заработано слотов: <b>{slots}</b> · до следующего: <b>{next_in}</b>

  Друг тоже в плюсе: получит <b>+{invited_bonus} дня</b> к первой подписке.

referral_qualified: |
  🎉 <b>Ваш друг {name} оформил подписку!</b>

  {reward_text}

# ── Служебное ──────────────────────────────────────────────────────────────
support_hint: |
  💬 <b>Поддержка</b>

  Опишите проблему — ответим в течение часа.
  Если VPN не работает, сначала попробуйте кнопку «🆘 Не работает»:
  в большинстве случаев она решает вопрос мгновенно.

error_generic: |
  😔 Что-то пошло не так. Попробуйте ещё раз через минуту.
  Если повторится — напишите в поддержку, мы уже видим эту ошибку.

rate_limited: "⏱ Слишком много запросов. Подождите минуту, пожалуйста."

